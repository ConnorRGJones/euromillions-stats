<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" width="480" height="80">
  <defs>
    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Gold accent bar -->
  <rect x="0" y="0" width="480" height="3" rx="1.5" fill="url(#goldLine)"/>

  <!-- EM badge -->
  <rect x="0" y="12" width="44" height="44" rx="10" fill="url(#goldLine)" opacity="0.15"/>
  <rect x="0" y="12" width="44" height="44" rx="10" fill="none" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
  <text x="22" y="39" text-anchor="middle" dominant-baseline="middle"
        font-family="'Myriad Pro', 'Gill Sans', 'Calibri', 'Trebuchet MS', Arial, sans-serif"
        font-weight="800" font-size="14" fill="#fbbf24" letter-spacing="-0.5">EM</text>

  <!-- Euro Million -->
  <text x="56" y="38"
        font-family="'Myriad Pro', 'Gill Sans', 'Calibri', 'Trebuchet MS', Arial, sans-serif"
        font-weight="700" font-size="28" fill="#ffffff" letter-spacing="-0.5">Euro Million</text>

  <!-- Stats — lighter weight -->
  <text x="56" y="58"
        font-family="'Myriad Pro', 'Gill Sans', 'Calibri', 'Trebuchet MS', Arial, sans-serif"
        font-weight="300" font-size="13" fill="rgba(255,255,255,0.55)" letter-spacing="3">STATS</text>
</svg>
