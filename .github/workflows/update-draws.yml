name: Update EuroMillions Draws

on:
  # Runs after every Tuesday (23:00) and Friday (23:00) draw — UK time
  schedule:
    - cron: "0 23 * * 2"   # Tuesday 23:00 UTC
    - cron: "0 23 * * 5"   # Friday  23:00 UTC
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest draw & update data.ts
        run: node scripts/update-draws.mjs

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet src/lib/data.ts; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/lib/data.ts
          git commit -m "chore: add latest EuroMillions draw $(date +'%d %b %Y')"
          git push

      - name: Install dependencies & build
        if: steps.changes.outputs.changed == 'true'
        run: npm ci && npm run build

      - name: Deploy to Netlify
        if: steps.changes.outputs.changed == 'true'
        run: npx netlify-cli deploy --dir=out --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
